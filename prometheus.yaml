global:
  scrape_interval: 15s

scrape_configs:
  - job_name: bms
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8089"]

  - job_name: middleware
    metrics_path: /actuator/prometheus
    static_configs:
      # Porta local do middleware é definida via --server.port=8084 na execução (ver README
      # do worker) para não colidir com o BMS, que também usa 8082 por padrão.
      - targets: ["host.docker.internal:8084"]
