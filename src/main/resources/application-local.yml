server:
  port: 8082

management:
  endpoint:
    health:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
      path-mapping:
        health: health
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  logging:
    level:
    org.springframework.web: DEBUG
    export:
      otlp:
        enabled: ${OTEL_EXPORTER_OTLP_ENABLED:true}
  opentelemetry:
    enabled: ${OTEL_EXPORTER_OTLP_ENABLED:true}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: local
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        enabled: ${OTEL_EXPORTER_OTLP_METRICS_ENABLED:true}

tlf:
  lending: {}
  logging:
    enabled: true
    disable-json-format-in-console: true

logging:
  sensitive:
    fields: ${LOGGING_SENSITIVE_FIELDS:password,senha,access_token,accessToken,Authorization}
    mask-enabled: ${LOGGING_MASK_ENABLED:false}
  otel-events:
    enabled: ${OTEL_LOG_EVENTS_ENABLED:true}

spring:
  application:
    name: ms-vivopay-credit-consent-bms
  datasource:
    base-url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/credit_consent}
    url: ${DATABASE_URL:${spring.datasource.base-url}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    table: flyway_schema_history_bms
    url: ${BMS_DATABASE_URL:${spring.datasource.base-url}}
    user: ${BMS_DATABASE_USERNAME:postgres}
    password: ${BMS_DATABASE_PASSWORD:postgres}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  data:
    redis:
      host: 127.0.0.1
      port: 6379
  thread-executor: virtual

jdbc:
  includes: connection,query
  datasource-proxy:
    include-parameter-values: ${JDBC_INCLUDE_PARAMETER_VALUES:true}
    query:
      enable-logging: ${JDBC_QUERY_LOGGING_ENABLED:true}
  opentelemetry:
    analysis:
      sanitize:
        enabled: ${JDBC_SANITIZE_QUERY_TEXT:false}

redis:
  ttl:
    sync-consent-status-seconds: ${SYNC_CONSENT_STATUS_TTL_REDIS:86400}
    consent-idempotency-check-seconds: ${CONSENT_IDEMPOTENCY_CHECK_TTL_REDIS:60}

observability:
  pii:
    redis-values-enabled: ${OBSERVABILITY_PII_REDIS_VALUES:true}
  noise-reduction:
    health-endpoints-enabled: ${OTEL_HEALTH_ENDPOINTS_ENABLED:true}

azure:
  eventhub:
    connection-string: ${EVENTHUB_CONNECTION_STRING:}
    event-hub-name: ${EVENTHUB_NAME:}

features:
  eventhub:
    parallel-publish-enabled: ${EVENTHUB_PARALLEL_PUBLISH_ENABLED:true}

springdoc:
  swagger-ui:
    use-root-path: true

lib-security:
  enabled: false  #PARAMETRO OBRIGATORIO
  jwks:
    cacheLifespan: 1440
    refreshTime: 120
    url: "https://autenticainthml.redecorp.br/vivooauth2/security"
  white-list:
    - path: "/swagger-ui/**"
      methods: "all"
    - path: "/swagger-resources/**"
      methods: "all"
    - path: "/v2/api-docs/**"
      methods: "all"
    - path: "/v3/api-docs/**"
      methods: "all"
    - path: "/actuator/health/**"
      methods: "all"
  user-info:
    oam-enabled: false
    scopeOauthClaim: oracle.oauth.scope
    scopes:
      default:
        uri: https://autenticainthml.redecorp.br/ms_oauth/resources/${scope}/me
        groupAttributeKey: '_Groups'
        nameAttributeKey: OAM_NOME

eureka:
  client:
    enabled: ${FEATURES_TOOGLE_ENABLE_EUREKA:false}
    register-with-eureka: ${EUREKA_CLIENT_SHOULD_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_CLIENT_SHOULD_FETCH_REGISTRY:true}
    g-zip-content: ${EUREKA_CLIENT_SHOULD_GZIP_CONTENT:true}
    registry-fetch-interval-seconds: ${EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    filter-only-up-instances: ${EUREKA_CLIENT_SHOULD_FILTER_ONLY_UP_INSTANCES:true}
    initial-instance-info-replication-interval-seconds: 40
    instance-info-replication-interval-seconds: ${EUREKA_CLIENT_INSTANCE_INFO_REPLICATION_INTERVAL_SECONDS:30}
    disable-delta: ${EUREKA_CLIENT_SHOULD_DISABLE_DELTA:false}
    on-demand-update-status-change: ${EUREKA_CLIENT_SHOULD_ON_DEMAND_UPDATE_STATUS_CHANGE:true}
    service-url:
      defaultZone: ${EUREKA_REGISTER_URL:http://localhost:8761/eureka}
  instance:
    non-secure-port: ${EUREKA_INSTANCE_PORT:8082}
    non-secure-port-enabled: ${EUREKA_INSTANCE_NON_SECURE_PORT_ENABLED:true}
    secure-port: ${EUREKA_INSTANCE_SECURE_PORT:443}
    secure-port-enabled: ${EUREKA_INSTANCE_SECURE_PORT_ENABLED:false}
    app-group-name: ${EUREKA_INSTANCE_APP_GROUP_NAME:system}
    appname: ${spring.application.name}
    instance-enabled-onit: ${EUREKA_INSTANCE_INSTANCE_ENABLED_ON_INIT:false}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    lease-renewal-interval-in-seconds: ${EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS:10}
    lease-expiration-duration-in-seconds: ${EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS:20}
    status-page-url-path: ${EUREKA_INSTANCE_STATUS_PAGE_URL_PATH:/actuator/info}
    health-check-url-path: ${EUREKA_INSTANCE_HEALTH_CHECK_URL_PATH:/actuator/health}
    metadata-map:
      system: ""
      domain: ""
      team: ""
