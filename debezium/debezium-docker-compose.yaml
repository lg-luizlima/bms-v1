name: ms-vivopay-credit-consent-bms-v1

services:

  postgres:
    image: quay.io/debezium/example-postgres:2.7
    container_name: postgres
    hostname: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ms_vivopay

  redis:
    image: redis:7-alpine
    container_name: redisdev
    hostname: redis
    ports:
      - "6379:6379"

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: unless-stopped
    ports:
      - "8001:5540"
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: "ms-vivopay-credit-consent (local)"
    volumes:
      - redis_insight_volume_data:/data
    depends_on:
      - redis

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:8.2.3
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.3
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # Runs as a standalone Debezium Server (Quarkus), the same runtime HML/prod run via the
  # Debezium Operator's DebeziumServer CRD (helm-chart-generic-java-debezium/templates/debezium.yaml)
  # — not a Kafka Connect worker. There is no REST API to register connectors against; capture
  # starts on boot straight from this container's own env vars (mirrors spec.sink/spec.source/
  # spec.format on that CRD). See ../debezium/README.md for the full mapping.
  debezium:
    build:
      context: .
    image: ms-vivopay-credit-consent-debezium-server-avro:3.6
    container_name: debezium
    hostname: debezium
    restart: unless-stopped # keeps retrying until tb_outbox_events exists (created by the BMS's own Flyway migration on boot)
    depends_on:
      - kafka
      - postgres
      - schema-registry
    ports:
      - "8083:8080" # Quarkus health/metrics (/q/health) — no longer a connector-management REST API
    volumes:
      - debezium_data:/debezium/data
    environment:

      # sink — Kafka producer. HML/prod point this at Confluent Cloud over SASL_SSL/PLAIN; locally
      # there's no real Confluent Cloud, so this targets the compose's own PLAINTEXT Kafka instead —
      # same config shape, local endpoint.
      DEBEZIUM_SINK_TYPE: kafka
      DEBEZIUM_SINK_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:29092
      DEBEZIUM_SINK_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      DEBEZIUM_SINK_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.ByteArraySerializer

      # source — same Postgres connector config as debezium.json (reference-only now, see README),
      # translated to Debezium Server's DEBEZIUM_SOURCE_* env var form. Only the BMS's own outbox is
      # captured here, matching HML/prod's tableIncludeList today — see plan/README for the worker
      # outbox gap this mirrors.
      DEBEZIUM_SOURCE_CONNECTOR_CLASS: io.debezium.connector.postgresql.PostgresConnector
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: postgres
      DEBEZIUM_SOURCE_DATABASE_PORT: 5432
      DEBEZIUM_SOURCE_DATABASE_USER: postgres
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: postgres
      DEBEZIUM_SOURCE_DATABASE_DBNAME: credit_consent
      DEBEZIUM_SOURCE_PLUGIN_NAME: pgoutput
      DEBEZIUM_SOURCE_TOPIC_PREFIX: credit-consent-cdc
      DEBEZIUM_SOURCE_SLOT_NAME: credit_consent_outbox_slot
      DEBEZIUM_SOURCE_PUBLICATION_NAME: credit_consent_publication
      # Debezium Server's own default offset-file path resolves to the debezium_data volume's
      # mount point itself rather than a file inside it (fails boot with "Is a directory" against
      # an empty bind-mounted directory) — pin it to an explicit file so the volume works.
      DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE_FILENAME: /debezium/data/offsets.dat
      DEBEZIUM_SOURCE_PUBLICATION_AUTOCREATE_MODE: filtered
      DEBEZIUM_SOURCE_SCHEMA_INCLUDE_LIST: public
      DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST: public.tb_outbox_events
      DEBEZIUM_SOURCE_TOMBSTONES_ON_DELETE: "false"

      DEBEZIUM_SOURCE_TRANSFORMS: outbox
      DEBEZIUM_SOURCE_TRANSFORMS_OUTBOX_TYPE: io.debezium.transforms.outbox.EventRouter
      DEBEZIUM_SOURCE_TRANSFORMS_OUTBOX_ROUTE_BY_FIELD: topic_name
      # Two layers of $$-escaping needed here: compose collapses $$ -> $ on its way into the
      # container ($$$${routedByValue} -> $${routedByValue}), then Quarkus/SmallRye Config (which
      # backs Debezium Server's env var config) collapses $$ -> $ again on its way into the
      # transform ($${routedByValue} -> ${routedByValue}). Skipping either layer makes SmallRye
      # treat ${routedByValue} as an (unresolvable) config property reference instead of a literal
      # value, which throws deep inside DebeziumServer.configToProperties at boot — confirmed by
      # running this image directly and bisecting the config down to this one property.
      DEBEZIUM_SOURCE_TRANSFORMS_OUTBOX_ROUTE_TOPIC_REPLACEMENT: $$$${routedByValue}
      DEBEZIUM_SOURCE_TRANSFORMS_OUTBOX_TABLE_EXPAND_JSON_PAYLOAD: "true"
      DEBEZIUM_SOURCE_TRANSFORMS_OUTBOX_TABLE_FIELD_EVENT_ID: event_id
      DEBEZIUM_SOURCE_TRANSFORMS_OUTBOX_TABLE_FIELD_EVENT_KEY: aggregate_id
      DEBEZIUM_SOURCE_TRANSFORMS_OUTBOX_TABLE_FIELD_EVENT_PAYLOAD: payload
      DEBEZIUM_SOURCE_TRANSFORMS_OUTBOX_TABLE_FIELDS_ADDITIONAL_PLACEMENT: >-
        aggregate_type:header:eventType,aggregate_id:header:aggregateId,created_at:header:createdAt,event_id:header:eventId,trace_context:header:traceparent

      # format — key/headers stay schema-less JSON, value is Avro via the local Schema Registry
      # (same split HML/prod use, minus SASL/basic-auth since this Schema Registry is local/unauthenticated)
      DEBEZIUM_FORMAT_KEY: json
      DEBEZIUM_FORMAT_KEY_SCHEMAS_ENABLE: "false"
      DEBEZIUM_FORMAT_HEADER: json
      DEBEZIUM_FORMAT_HEADER_SCHEMAS_ENABLE: "false"
      DEBEZIUM_FORMAT_VALUE: avro
      DEBEZIUM_FORMAT_VALUE_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      DEBEZIUM_FORMAT_VALUE_AUTO_REGISTER_SCHEMAS: "true"

      # logging — native Quarkus logging works here (this image never swaps in a different SLF4J
      # binding, unlike HML/prod's EXTRA_CONNECTOR=cassandra-5 — see Dockerfile), so plain
      # QUARKUS_LOG_LEVEL is enough; no logbackConfig/JAVA_OPTS hack needed. HML/prod additionally
      # keep io.debezium.connector.base.ChangeEventQueue at INFO under a DEBUG root via
      # logbackConfig — the equivalent QUARKUS_LOG_CATEGORY__...__LEVEL override for that one
      # logger did not take effect when tested against this image/version, so this stays INFO
      # root instead of chasing a DEBUG root down to noise. Flip to DEBUG here for deep debugging.
      QUARKUS_LOG_LEVEL: INFO

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC — as 3 apps apontam OTEL_EXPORTER_OTLP_ENDPOINT para cá
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo
      - jaeger
      - loki

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200" # API de consulta do Tempo (usada pelo datasource do Grafana)

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI/API do Jaeger
      - "4319:4317"   # porta remapeada no host — 4317 já é usado pelo otel-collector

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ../loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100" # API do Loki (query + ingestão OTLP nativa em /otlp/v1/logs)

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ../prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway" # scrape das 3 apps rodando no host (fora do compose)

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - loki
      - prometheus

volumes:
  tempo_data:
  redis_insight_volume_data:
  loki_data:
  debezium_data: