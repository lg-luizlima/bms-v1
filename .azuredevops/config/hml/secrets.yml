# NUNCA DEFINA VALORES ABERTOS/PUBLICOS/VISÍVEL AQUI!
# Sempre utilize os marcadores de substituição $(NOME-DA-SECRET-LIBRARY-AZURE-DEVOPS).
# Valores aberto devem ser definidos no arquivo environments_variables.yaml conforme o ambiente na pasta .azuredevops/helm 
secrets: 
- name: BMS_DATABASE_URL
  value: "$(BMS_DATABASE_URL_HML)"
- name: BMS_DATABASE_USERNAME
  value: "$(BMS_DATABASE_USERNAME_HML)"
- name: BMS_DATABASE_PASSWORD
  value: "$(BMS_DATABASE_PASSWORD_HML)"
- name: BMS_REDIS_HOST
  value: "$(BMS_REDIS_HOST_HML)"
- name: EVENTHUB_CONNECTION_STRING
  value: "$(EVENTHUB_CONNECTION_STRING_HML)"
- name: EVENTHUB_NAME
  value: "$(EVENTHUB_NAME_HML)"

- name: OTEL_EXPORTER_OTLP_ENABLED
  value: "$(OTEL_EXPORTER_OTLP_ENABLED_HML)"
- name: OTEL_EXPORTER_OTLP_METRICS_ENABLED
  value: "$(OTEL_EXPORTER_OTLP_METRICS_ENABLED_HML)"
- name: OTEL_TRACES_SAMPLER_PROBABILITY
  value: "$(OTEL_TRACES_SAMPLER_PROBABILITY_HML)"
- name: OTEL_EXPORTER_OTLP_ENDPOINT
  value: "$(OTEL_EXPORTER_OTLP_ENDPOINT_HML)"
- name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
  value: "$(OTEL_EXPORTER_OTLP_LOGS_ENDPOINT_HML)"
- name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
  value: "$(OTEL_EXPORTER_OTLP_METRICS_ENDPOINT_HML)"

secretFiles: []
