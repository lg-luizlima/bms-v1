  enabled: "false"
  client:
    shouldRegisterWithEureka: "true"
    serviceUrl: "http://vivo-service-discovery.msv-tools:8761/eureka"
  instance:
    port: "8082"
    appGroupName: "core-crédito-vivo-pay"
    statusPageUrlPath: "/actuator/info"
    healthCheckUrlPath: "/actuator/health"
    
