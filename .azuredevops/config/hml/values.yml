# See https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 300m
    memory: 256Mi

# See https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
autoscaling:
  enabled: false
  istioEnabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage:

# See https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
nodeSelector: {}

# See https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
tolerations: []

# See https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes-using-node-affinity/
affinity: {}

# See https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# NOTE: usa o grupo dedicado de liveness (não o /actuator/health agregado) para que uma
# instabilidade passageira de DB/Redis derrube só a readiness, não reinicie o pod.
liveness:
  enabled: true
  failureThreshold: 3
  initialDelaySeconds: 120
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 220
  healthCheck: /actuator/health/liveness

# See https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
readiness:
  enabled: true
  failureThreshold: 3
  initialDelaySeconds: 120
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 220
  healthCheck: /actuator/health/readiness

# See https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# Dá uma janela de carência para o Flyway/migrations rodarem no boot antes que a liveness
# comece a contar — CONFIRMAR se o chart generic-java-microservice (repo externo
# DevOps/Vivo.CodePlay.Pipelines) realmente consome esta chave antes de depender dela.
startupProbe:
  enabled: true
  failureThreshold: 30
  periodSeconds: 10
  healthCheck: /actuator/health/readiness

