debezium:
  enabled: true
  serverName: postgres-cdc-credit-consent-bms-v1

  kafka:
    bootstrapServers: "pkc-12pd3.brazilsouth.azure.confluent.cloud:9092"

  database:
    host: sql-credit-consent.postgres.database.azure.com
    port: 5432
    name: sql-credit-consent
    schema: "public"

  publicationName: credit_consent_bms_outbox_publication
  slotName: credit_consent_bms_outbox_slot
  topicPrefix: test.debezium
  tableIncludeList: public.tb_outbox_events

