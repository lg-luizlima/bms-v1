name: deploy-debezium

pr: none
trigger: none

parameters:
- name: deployDev
  type: boolean
  default: false
- name: deployHml
  type: boolean
  default: true
- name: deployProd
  type: boolean
  default: false
- name: dryRun
  type: boolean
  default: true

stages:
- stage: Debezium_DEV
  displayName: Debezium DEV
  condition: and(succeeded(), eq(${{ parameters.deployDev }}, true))
  jobs:
  - job: ReconcileDev
    displayName: Reconcile Debezium DEV
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: Authenticate and load AKS credentials (DEV)
      inputs:
        azureSubscription: $(AZURE_SERVICE_CONNECTION_DEV)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az aks get-credentials \
            --resource-group "$(AKS_RESOURCE_GROUP_DEV)" \
            --name "$(AKS_CLUSTER_NAME_DEV)" \
            --overwrite-existing
    - bash: |
        set -euo pipefail
        chmod +x .azuredevops/debezium/reconcile.sh
        if [[ '${{ parameters.dryRun }}' == 'true' ]]; then
          .azuredevops/debezium/reconcile.sh dev --dry-run
        else
          .azuredevops/debezium/reconcile.sh dev
        fi
      displayName: Reconcile DebeziumServer (DEV)
      env:
        DEBEZIUM_DATABASE_PASSWORD: $(DEBEZIUM_DATABASE_PASSWORD_DEV)
        DEBEZIUM_API_KEY: $(DEBEZIUM_API_KEY_DEV)
        DEBEZIUM_API_SECRET: $(DEBEZIUM_API_SECRET_DEV)

- stage: Debezium_HML
  displayName: Debezium HML
  condition: and(succeeded(), eq(${{ parameters.deployHml }}, true))
  jobs:
  - job: ReconcileHml
    displayName: Reconcile Debezium HML
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: Authenticate and load AKS credentials (HML)
      inputs:
        azureSubscription: $(AZURE_SERVICE_CONNECTION_HML)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az aks get-credentials \
            --resource-group "$(AKS_RESOURCE_GROUP_HML)" \
            --name "$(AKS_CLUSTER_NAME_HML)" \
            --overwrite-existing
    - bash: |
        set -euo pipefail
        chmod +x .azuredevops/debezium/reconcile.sh
        if [[ '${{ parameters.dryRun }}' == 'true' ]]; then
          .azuredevops/debezium/reconcile.sh hml --dry-run
        else
          .azuredevops/debezium/reconcile.sh hml
        fi
      displayName: Reconcile DebeziumServer (HML)
      env:
        DEBEZIUM_DATABASE_PASSWORD: $(DEBEZIUM_DATABASE_PASSWORD_HML)
        DEBEZIUM_API_KEY: $(DEBEZIUM_API_KEY_HML)
        DEBEZIUM_API_SECRET: $(DEBEZIUM_API_SECRET_HML)

- stage: Debezium_PROD
  displayName: Debezium PROD
  condition: and(succeeded(), eq(${{ parameters.deployProd }}, true))
  jobs:
  - deployment: ReconcileProd
    displayName: Reconcile Debezium PROD
    environment: prod
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Authenticate and load AKS credentials (PROD)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION_PROD)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group "$(AKS_RESOURCE_GROUP_PROD)" \
                  --name "$(AKS_CLUSTER_NAME_PROD)" \
                  --overwrite-existing
          - bash: |
              set -euo pipefail
              chmod +x .azuredevops/debezium/reconcile.sh
              if [[ '${{ parameters.dryRun }}' == 'true' ]]; then
                .azuredevops/debezium/reconcile.sh prod --dry-run
              else
                .azuredevops/debezium/reconcile.sh prod
              fi
            displayName: Reconcile DebeziumServer (PROD)
            env:
              DEBEZIUM_DATABASE_PASSWORD: $(DEBEZIUM_DATABASE_PASSWORD_PROD)
              DEBEZIUM_API_KEY: $(DEBEZIUM_API_KEY_PROD)
              DEBEZIUM_API_SECRET: $(DEBEZIUM_API_SECRET_PROD)
